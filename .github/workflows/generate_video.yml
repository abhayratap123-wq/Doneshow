name: Live Multi-Token Video Engine

on:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: '0 16 * * *' # 9:30 PM IST (Full run)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  make_video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install requests moviepy==1.0.3 edge-tts

      - name: Run Python Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_TOKEN2: ${{ secrets.HF_TOKEN2 }}
          HF_TOKEN3: ${{ secrets.HF_TOKEN3 }}
          HF_TOKEN4: ${{ secrets.HF_TOKEN4 }}
          HF_TOKEN5: ${{ secrets.HF_TOKEN5 }}
          HF_TOKEN6: ${{ secrets.HF_TOKEN6 }}
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]; then
            export RUN_MODE="FULL"
          else
            export RUN_MODE="DEMO"
          fi
          python master_generator.py

      - name: Push Updates
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add *.mp4 index.html history.json video_state.json || echo "No files"
          git commit -m "Auto Update: Video & HTML Dashboard" || echo "No changes"
          git push
